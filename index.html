<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BG Control</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="sidebar">

<h2>BG CONTROL</h2>

<p>📦 Inventario</p>
<p>🛒 Compras</p>
<p>🥖 Producción</p>
<p>📊 Reportes</p>
<p>⚙️ Configuración</p>

</div>



<div class="main">


<h1>Dashboard</h1>


<div class="cards">


<div class="card">

<h3>📦 Productos</h3>

<strong id="totalProductos">
0
</strong>

</div>


<div class="card warning">

<h3>⚠️ Stock Bajo</h3>

<strong id="totalAlertas">
0
</strong>

</div>


<div class="card">

<h3>💰 Inventario</h3>

<strong id="valorInventario">
$0
</strong>

</div>


</div>



<h2>Inventario Actual</h2>


<table>


<thead>

<tr>

<th>Producto</th>
<th>Categoría</th>
<th>Stock</th>
<th>Mínimo</th>

</tr>

</thead>


<tbody id="productos">

</tbody>


</table>


</div>


<script src="app.js"></script>


</body>

</html>
