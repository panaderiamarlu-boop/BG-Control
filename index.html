<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BG Control</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="sidebar">

<h2>BG CONTROL</h2>

<p>🏠 Dashboard</p>
<p>📦 Inventario</p>
<p>🛒 Compras</p>
<p>🥖 Producción</p>
<p>📊 Reportes</p>

</div>



<div class="main">


<h1>Dashboard</h1>

<button onclick="abrirFormularioProducto()">
➕ Nuevo Producto
</button>



<div class="cards">


<div class="card">

<h3>📦 Productos</h3>

<strong id="totalProductos">0</strong>

</div>



<div class="card warning">

<h3>⚠️ Stock Bajo</h3>

<strong id="totalAlertas">0</strong>

</div>



<div class="card">

<h3>💰 Inventario</h3>

<strong id="valorInventario">$0</strong>

</div>


</div>



<h2>Inventario Actual</h2>


<table>


<thead>

<tr>

<th>Producto</th>

<th>Categoría</th>

<th>Stock</th>

<th>Mínimo</th>

<th>Estado</th>

</tr>

</thead>


<tbody id="productos">

</tbody>


</table>



</div>





<!-- FORMULARIO -->

<div id="modalProducto" class="modal">


<div class="formulario">


<h2>Nuevo Producto</h2>


<input id="codigo" placeholder="Código">


<input id="nombre" placeholder="Nombre">


<select id="tipo">

<option>MATERIA PRIMA</option>

<option>PRODUCTO TERMINADO</option>

</select>


<input id="categoria" placeholder="Categoría">


<input id="unidad" placeholder="Unidad">


<input id="stock" type="number" placeholder="Stock inicial">


<input id="minimo" type="number" placeholder="Stock mínimo">


<input id="costo" type="number" placeholder="Costo unitario">


<input id="precio" type="number" placeholder="Precio venta">


<button onclick="guardarProducto()">

Guardar

</button>


<button onclick="cerrarFormularioProducto()">

Cancelar

</button>



</div>


</div>





<script src="modules/inventario.js"></script>

<script src="modules/productos.js"></script>

<script src="app.js"></script>


</body>

</html>
